<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D Table — token card</title>
<link rel="stylesheet" href="_engine/app/style.css">
<style>
  body { margin: 0; padding: 8px 10px; background: var(--bg, #15110d); font-size: 13px; }
  .tc-head { display: flex; gap: 10px; align-items: center; }
  .tc-pic { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #2a2118; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  .tc-name { font-family: var(--head); font-size: 17px; color: var(--gold2); line-height: 1.1; }
  .tc-sub { color: var(--dim); font-size: 12px; }
  .tc-bar { height: 7px; background: #2a221a; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .tc-bar i { display: block; height: 100%; background: linear-gradient(90deg, #b44, #5cb85c); }
  .tc-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
  .tc-row button { padding: 3px 8px; font-size: 12px; }
  .tc-row input { width: 4.2em; padding: 3px 5px; }
  .tc-acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tc-acts button { padding: 4px 8px; font-size: 12px; text-align: left; }
  .tc-acts small { display: block; color: var(--dim); font-size: 10px; }
  .tc-link button { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 4px 8px; }
  .tc-msg { color: var(--dim); padding: 6px 0; }
  .tc-mode button.on { border-color: var(--gold); color: var(--gold2); background: #3d3122; }
  h4 { margin: 8px 0 2px; font-size: 13px; color: var(--gold2); }
  .tc-head { position: relative; }
  .tc-topx { text-align: right; margin: -2px 0 4px; } .tc-topx button { padding: 2px 8px; }
  .tc-light button.on { border-color: var(--gold); color: var(--gold2); background: #3d3122; } .tc-light small { color: var(--dim); }
  .tc-x { position: absolute; right: 0; top: 0; padding: 2px 8px; }
  .tc-turn { margin: 6px 0 2px; padding: 4px 6px; background: #241c14; border-radius: 6px; font-size: 12px; }
  .tc-ec { display: inline-block; margin: 0 1px; } .tc-ec.used { opacity: .3; filter: grayscale(1); }
  .tc-acts button { flex: 1 1 46%; min-width: 140px; }
  .tc-acts button:disabled { opacity: .55; }
  .tc-acts button.spent { opacity: .6; border-style: dashed; }
  .tc-no { color: #e07a6a !important; } .tc-warn { color: #e0b96a !important; } .tc-hint { color: var(--dim); font-size: 12px; margin: 4px 0; }
  .tc-pick { display: block; padding: 3px 4px; border-bottom: 1px solid #2a2118; cursor: pointer; } .tc-pick.ally { color: #f0c27a; } .tc-pick.far { opacity: .6; }
  .tc-row button.primary { border-color: var(--gold); color: var(--gold2); }
  .tc-move { margin: 6px 0; padding: 6px 8px; border: 1px solid #3f6b3f; background: #1d2a1b; border-radius: 6px; font-size: 13px; } .tc-move b { color: #9be39b; font-size: 15px; } .tc-move small { color: var(--dim); }
</style>
</head>
<body>
<!-- Shown inside Owlbear's context menu when ONE token is selected. Code: _engine/app/obr-card.js -->
<div id="card"><p class="tc-msg">⏳</p></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const SDK = 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';
  // watchdog: if the window is still empty after 6 s, say so (with the stage it stopped at) and offer a retry
  window.__stage = 'sdk';
  const note = st => { try { localStorage.setItem('dnd.popStage', JSON.stringify({ st, t: Date.now(), pop: !!q.get('pop') })); } catch (e) {} }; // the panel can show where windows get stuck
  // still ⏳ after 5 s: reload this window ONCE by itself (Owlbear sometimes never says "ready" to a fresh popover)
  setTimeout(() => {
    const c = document.getElementById('card'); if (!c || c.textContent.trim() !== '⏳') return;
    note(window.__stage);
    let tries = 0; try { tries = Number(sessionStorage.getItem('dnd.popRetry') || 0); } catch (e) {}
    if (tries < 1) { try { sessionStorage.setItem('dnd.popRetry', String(tries + 1)); } catch (e) {} location.reload(); }
  }, 5000);
  setTimeout(() => {
    const c = document.getElementById('card'); if (!c || c.textContent.trim() !== '⏳') { try { sessionStorage.removeItem('dnd.popRetry'); } catch (e) {} return; }
    note(window.__stage);
    c.innerHTML = '<p class="tc-msg">⚠️ Окно не загрузилось (этап: ' + window.__stage + '). Ходи через панель D&amp;D Table — вкладка «Бой».</p><p><button onclick="location.reload()">🔄 Ещё раз</button></p>';
  }, 6000);
  const imp = async u => { for (let i = 0; i < 4; i++) { try { return await Promise.race([import(i ? u + (u.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now() : u), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 8000))]); } catch (e) { if (i === 3) throw e; await new Promise(r => setTimeout(r, 1500)); } } }; // retry a slow / failed load
  (async () => {
    try {
      const OBR = q.get('fakeobr') ? (await import('./_dev/fakeobr.js')).default(q.get('fakeobr'), q.get('name') || q.get('fakeobr'), q.get('sel')) : await imp(SDK).then(m => { window.OBR_SDK = m; return m.default; });
      window.__stage = 'code';
      const { startCard } = await imp('./_engine/app/obr-card.js');
      window.__stage = 'obr';
      startCard(OBR, { pop: !!q.get('pop') });
    } catch (e) { document.getElementById('card').innerHTML = '<p class="tc-msg">⚠️ ' + String(e.message || e).replace(/</g, '&lt;') + '</p>'; }
  })();
</script>
</body>
</html>
