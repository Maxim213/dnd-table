<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D Table — token card</title>
<link rel="stylesheet" href="_engine/app/style.css">
<style>
  body { margin: 0; padding: 8px 10px; background: var(--bg, #15110d); font-size: 13px; }
  .tc-head { display: flex; gap: 10px; align-items: center; }
  .tc-pic { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #2a2118; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  .tc-name { font-family: var(--head); font-size: 17px; color: var(--gold2); line-height: 1.1; }
  .tc-sub { color: var(--dim); font-size: 12px; }
  .tc-bar { height: 7px; background: #2a221a; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .tc-bar i { display: block; height: 100%; background: linear-gradient(90deg, #b44, #5cb85c); }
  .tc-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
  .tc-row button { padding: 3px 8px; font-size: 12px; }
  .tc-row input { width: 4.2em; padding: 3px 5px; }
  .tc-acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tc-acts button { padding: 4px 8px; font-size: 12px; text-align: left; }
  .tc-acts small { display: block; color: var(--dim); font-size: 10px; }
  .tc-link button { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 4px 8px; }
  .tc-msg { color: var(--dim); padding: 6px 0; }
  .tc-mode button.on { border-color: var(--gold); color: var(--gold2); background: #3d3122; }
  h4 { margin: 8px 0 2px; font-size: 13px; }
</style>
</head>
<body>
<!-- Shown inside Owlbear's context menu when ONE token is selected. Code: _engine/app/obr-card.js -->
<div id="card"><p class="tc-msg">⏳</p></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const SDK = 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';
  (async () => {
    try {
      const OBR = q.get('fakeobr') ? (await import('./_dev/fakeobr.js')).default(q.get('fakeobr'), q.get('name') || q.get('fakeobr'), q.get('sel')) : (await import(SDK)).default;
      const { startCard } = await import('./_engine/app/obr-card.js');
      startCard(OBR);
    } catch (e) { document.getElementById('card').innerHTML = '<p class="tc-msg">⚠️ ' + String(e.message || e).replace(/</g, '&lt;') + '</p>'; }
  })();
</script>
</body>
</html>
