<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D Game</title>
<link rel="stylesheet" href="_engine/app/style.css">
</head>
<body>
<header class="top">
  <div class="brand">🐉 <b>D&amp;D Game</b> <span class="modetag" id="modeTag"></span> <span class="langsw" id="langSw"></span> <span class="topctl" id="topCtl"></span></div>
  <nav>
    <button class="dm-only gamebtn" id="gameTag" data-act="nav" data-v="games" data-t-title="Your games (save slots)">🎲</button>
    <button class="need-game" data-act="nav" data-v="home" data-t="🧙 Characters">🧙 Characters</button>
    <button class="need-game" data-act="nav" data-v="items" data-t="🎒 Equipment">🎒 Equipment</button>
    <button class="dm-only need-game" data-act="nav" data-v="combat" data-t="⚔️ Combat">⚔️ Combat</button>
    <button data-act="nav" data-v="help" data-t="❓ How to use">❓ How to use</button>
  </nav>
</header>
<div class="wrap">
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pop"></div>
<input type="file" id="importFile" accept=".json,application/json" multiple hidden>
<input type="file" id="gameFile" accept=".json,application/json" hidden>
<input type="file" id="portraitFile" accept="image/*" hidden>
