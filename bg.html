<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>D&amp;D Table — background</title></head>
<body>
<!-- Owlbear Rodeo background page of the extension: runs the whole time the room is open (even with the panel closed).
     It carries the sync between the DM and the players. Code: _engine/app/obr-bg.js -->
<script type="module">
  const q = new URLSearchParams(location.search);
  const SDK = 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';
  (async () => {
    try {
      const OBR = q.get('fakeobr') ? (await import('./_dev/fakeobr.js')).default(q.get('fakeobr'), q.get('name') || q.get('fakeobr')) : (await import(SDK)).default;
      const { startBackground } = await import('./_engine/app/obr-bg.js');
      startBackground(OBR);
    } catch (e) { console.error('D&D Table background:', e); }
  })();
</script>
</body>
</html>
